<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIチーム組織図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 色の決まり。暗い画面ひとつに決めている */
:root {
  color-scheme: dark;
  --bg: #060d16; --panel: #0a1522; --card: #0d1b2a; --card-hi: #0f2438;
  --line: #1b3247; --wire: #1f3c55; --ink: #e4eef5; --sub: #7d95a8; --faint: #4a6275;
  --cyan: #3fd8f0; --ok: #4ade80; --amber: #f2b441; --violet: #a78bfa; --live: #ff4d5e;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; padding-block: 12px 32px; padding-inline: 16px;
  color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(63,216,240,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(63,216,240,.045) 1px, transparent 1px);
  background-size: 28px 28px;
}
button { font-family: inherit; color: var(--ink); cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ===== 上の帯（時計と数字） ===== */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 12px; }
.live { display: flex; align-items: center; gap: 6px; font: 600 11px var(--mono); letter-spacing: .12em; color: var(--live); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); animation: pulse 1.6s infinite; }
.paused .live { color: var(--sub); }
.paused .live i { background: var(--sub); box-shadow: none; }
#clock { font: 600 22px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.chip { font-size: 11px; color: var(--sub); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.btn { font-size: 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; min-height: 32px; }
.btn:hover { border-color: var(--cyan); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px 5px; min-width: 88px; }
.stat span { display: block; font-size: 10px; color: var(--sub); letter-spacing: .04em; }
.stat b { font: 600 18px var(--mono); font-variant-numeric: tabular-nums; color: var(--cyan); }
.stat b.violet { color: var(--violet); }
.spark { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 10px; color: var(--sub); }
.spark b { font: 600 12px var(--mono); color: var(--ink); }
.spark svg { width: 132px; height: 30px; display: block; }

/* ===== 組織図の枠 ===== */
.viewport { overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: rgba(6,13,22,.6); -webkit-overflow-scrolling: touch; }
.stage { position: relative; }
.chart { position: relative; width: max-content; padding: 26px 28px 30px; transform-origin: 0 0; }
.wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.wires path { fill: none; stroke-width: 1.4; }
.w .base { stroke: var(--wire); }
.w .flow { display: none; stroke: var(--cyan); stroke-width: 1.6; stroke-dasharray: 3 9; animation: flow 1.1s linear infinite; }
.w.on .base { stroke: rgba(63,216,240,.45); filter: drop-shadow(0 0 3px rgba(63,216,240,.55)); }
.w.on .flow { display: inline; }
.w circle { fill: #bff6ff; display: none; filter: drop-shadow(0 0 4px var(--cyan)); }
.w.on circle { display: inline; }
.w.tool .base { stroke: rgba(242,180,65,.55); }
.w.peer .base { stroke: rgba(167,139,250,.7); stroke-dasharray: 5 5; }
.w.peer.flash .base { stroke: var(--violet); filter: drop-shadow(0 0 5px var(--violet)); }
.w.indep .base { stroke-dasharray: 4 4; }
@keyframes flow { to { stroke-dashoffset: -12; } }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }

.owner-row { display: flex; justify-content: center; }
.teams { display: flex; gap: 18px; align-items: stretch; margin-top: 54px; }
.team { border: 1px solid var(--line); border-radius: 14px; background: rgba(10,21,34,.72); padding: 14px 18px 24px; }
.team h2 { display: flex; align-items: baseline; gap: 8px; margin: 0; font-size: 16px; font-weight: 700; }
.team h2 small { font-size: 11px; color: var(--sub); font-weight: 400; }
.team h2 .mk { font: 600 15px var(--mono); color: var(--cyan); }
.codex h2 .mk { color: var(--violet); }
.lead-row { position: relative; display: flex; justify-content: center; margin-top: 14px; }
.codex .lead-row { justify-content: flex-start; }

/* 道具（MCP） */
.tools { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: grid; gap: 6px; }
.tools .ic { display: flex; gap: 4px; }
.tools .ic span { font-size: 9px; color: var(--sub); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--card); }
.tools .tag { font-size: 11px; font-weight: 700; color: var(--amber); border: 1px solid rgba(242,180,65,.6); border-radius: 6px; padding: 2px 10px; background: rgba(242,180,65,.07); width: max-content; }
.peer-tag { position: absolute; z-index: 2; transform: translate(-50%, -50%); font-size: 10px; font-weight: 700; color: var(--violet); background: #120f24; border: 1px solid rgba(167,139,250,.5); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }

/* ===== 人の札 ===== */
.card, .agent { position: relative; z-index: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: border-color .3s, box-shadow .3s, background .3s, opacity .3s; }
.card:hover, .agent:hover { border-color: var(--cyan); }
.s-active { border-color: rgba(63,216,240,.85); background: var(--card-hi); box-shadow: 0 0 0 1px rgba(63,216,240,.2), 0 0 18px rgba(63,216,240,.22); }
.s-idle { opacity: .7; }
.owner, .lead { width: 196px; min-height: 74px; padding: 9px 44px 9px 12px; border-color: rgba(63,216,240,.6); box-shadow: 0 0 22px rgba(63,216,240,.12); }
.codex .lead { border-color: rgba(167,139,250,.6); box-shadow: 0 0 22px rgba(167,139,250,.12); }
.eyebrow { display: block; font: 600 9px var(--mono); color: var(--sub); letter-spacing: .08em; }
.owner .nm, .lead .nm { font-size: 18px; font-weight: 700; line-height: 1.3; }
.wish { display: inline-block; margin-top: 2px; font-size: 10px; font-weight: 700; color: var(--amber); }
.agent { width: 128px; height: 104px; padding: 9px 10px 8px; display: grid; grid-template-rows: auto auto 1fr auto; }
.agent.wide { width: 214px; height: auto; min-height: 82px; }
.nm { font-weight: 700; font-size: 14px; padding-right: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rl { font-size: 10.5px; color: var(--sub); line-height: 1.35; }
.rs { font-size: 10px; color: var(--sub); opacity: .85; }
.meta { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--sub); align-self: end; }
.lv { font: 600 9.5px var(--mono); color: var(--ink); background: #132638; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.st { display: inline-flex; align-items: center; gap: 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.s-active .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: pulse 1.6s infinite; }
.s-recent .dot { background: var(--ok); opacity: .55; }
.task { font-size: 10px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 15px; }
.s-active .task { color: var(--cyan); }
.s-recent .task { color: var(--ok); }

/* 丸いアイコン（頭文字） */
.av { position: absolute; top: -11px; right: -9px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  background: radial-gradient(circle at 35% 30%, hsl(var(--h) 80% 68%), hsl(var(--h) 60% 32%)); border: 2px solid var(--bg); }
.owner .av, .lead .av { width: 42px; height: 42px; font-size: 18px; top: -14px; right: -12px; }
.s-active .av::after, .lead .av::after { content: ""; position: absolute; inset: -5px; border-radius: 50%;
  background: conic-gradient(var(--cyan), transparent 40%, var(--cyan) 80%, transparent);
  -webkit-mask: radial-gradient(closest-side, transparent 82%, #000 84%); mask: radial-gradient(closest-side, transparent 82%, #000 84%);
  animation: spin 2.4s linear infinite; }
.codex .lead .av::after { background: conic-gradient(var(--violet), transparent 40%, var(--violet) 80%, transparent); }

/* ===== 部署 ===== */
.depts { display: flex; gap: 12px; align-items: flex-start; margin-top: 58px; }
.dh { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: #0b1a28; font-size: 12px; font-weight: 700; position: relative; z-index: 1; }
.dh b { width: 8px; height: 8px; border-radius: 2px; background: hsl(var(--h) 80% 60%); box-shadow: 0 0 6px hsl(var(--h) 80% 60%); }
.dh em { margin-left: auto; font: 600 10px var(--mono); font-style: normal; color: var(--sub); }
.dh em.hot { color: var(--cyan); }
.items { display: grid; grid-template-columns: repeat(var(--cols), 128px); gap: 16px 18px; padding: 20px 0 0 14px; }
.sub { position: relative; z-index: 1; width: 128px; min-height: 34px; display: flex; align-items: center; gap: 7px; padding: 5px 9px; font-size: 10.5px; line-height: 1.25;
  background: var(--card); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; transition: border-color .3s, box-shadow .3s, opacity .3s; }
.sub:hover { border-color: var(--cyan); }
.sub .si { width: 10px; height: 10px; border-radius: 3px; flex: none; background: hsl(var(--h) 70% 55%); }
.sub .dot { margin-left: auto; }

.codex { width: 262px; }
.cmembers { display: grid; gap: 18px; padding: 44px 0 0 18px; }
.indep-label { font-size: 9.5px; color: var(--sub); margin: 8px 0 -10px; }

/* ===== 最近の動き ===== */
.below { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 14px; }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.log header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 8px; }
.log h3 { margin: 0; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--sub); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .s-active, .legend .s-recent, .legend .s-idle { background: none; border: 0; box-shadow: none; opacity: 1; }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.log li { display: grid; grid-template-columns: 62px 18px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 12.5px; }
.log li time { font: 500 11px var(--mono); color: var(--sub); font-variant-numeric: tabular-nums; }
.log li .mini { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: hsl(var(--h) 60% 42%); }
.log li.new { animation: fadein .6s ease; }
@keyframes fadein { from { background: rgba(63,216,240,.12); } to { background: transparent; } }
.note { font-size: 11px; color: var(--sub); margin: 0; }

/* ===== 詳しく見る（右の引き出し） ===== */
.drawer { position: fixed; z-index: 10; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100% - 32px)); overflow-y: auto; background: #0b1826; border: 1px solid rgba(63,216,240,.5); border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,.6); padding: 18px; }
.drawer .hd { display: flex; align-items: center; gap: 12px; }
.drawer .big { position: relative; top: 0; right: 0; width: 52px; height: 52px; font-size: 22px; flex: none; }
.drawer h3 { margin: 0; font-size: 20px; }
.drawer .hd p { margin: 0; font-size: 12px; color: var(--sub); }
.drawer .x { margin-left: auto; align-self: flex-start; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 18px; }
.drawer dl { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 8px 12px; margin: 16px 0; font-size: 13px; }
.drawer dt { color: var(--sub); font-size: 11.5px; }
.drawer dd { margin: 0; }
.drawer h4 { font-size: 12px; color: var(--sub); margin: 14px 0 6px; letter-spacing: .04em; }
.drawer ul { margin: 0; padding-left: 1.1em; font-size: 12.5px; display: grid; gap: 4px; }
.drawer ul time { font: 500 11px var(--mono); color: var(--sub); margin-right: 6px; }
@media (max-width: 560px) {
  .drawer { top: auto; left: 16px; right: 16px; width: auto; max-height: 72%; }
  .spark { margin-left: 0; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; }
  .stat { min-width: 0; padding: 4px 7px; }
  .stat span { font-size: 9px; line-height: 1.3; }
  .stat b { font-size: 15px; }
}

/* 一時停止中と、動きを減らす設定 */
.paused .flow, .paused .dot, .paused .av::after, .paused .live i { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .w circle { display: none !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="live"><i></i><span id="liveText">LIVE</span></div>
  <time id="clock">--:--:--</time>
  <span class="chip">見本データ</span>
  <button id="pause" class="btn" type="button" aria-pressed="false">動きを止める</button>
  <div class="stats">
    <div class="stat"><span>稼働中の担当</span><b id="sActive">0</b></div>
    <div class="stat"><span>今日の出動</span><b id="sToday">0</b></div>
    <div class="stat"><span>今日の完了</span><b id="sDone">0</b></div>
    <div class="stat"><span>Codexと最終連絡</span><b id="sPeer" class="violet">--:--</b></div>
  </div>
  <div class="spark">
    <span>24時間の出動<br><b id="s24">0</b> 回</span>
    <svg id="spark" viewBox="0 0 132 30" role="img" aria-label="24時間の出動回数の推移"></svg>
  </div>
  <button id="fit" class="btn" type="button">等倍で見る</button>
</header>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <div class="chart" id="chart">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <div class="owner-row" id="ownerRow"></div>
      <div class="teams">
        <section class="team claude" aria-label="Claude Code のチーム">
          <h2><span class="mk">✳</span>Claude Code <small id="claudeLeadName"></small></h2>
          <div class="lead-row" id="claudeLeadRow"></div>
          <div class="depts" id="depts"></div>
        </section>
        <section class="team codex" aria-label="Codex のチーム">
          <h2><span class="mk">◆</span>Codex <small id="codexLeadName"></small></h2>
          <div class="lead-row" id="codexLeadRow"></div>
          <div class="cmembers" id="cmembers"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<div class="below">
  <section class="log" aria-live="polite">
    <header>
      <h3>最近の動き</h3>
      <div class="legend">
        <span class="s-active"><i class="dot"></i>稼働中</span>
        <span class="s-recent"><i class="dot"></i>最近（仕事を終えた）</span>
        <span class="s-idle"><i class="dot"></i>待機</span>
      </div>
    </header>
    <ol id="log"></ol>
  </section>
  <p class="note">札を押すと、その担当の仕事と記録が見られます。人や部署を変えたい時は、ファイルの中の「組織の中身」を書き換えてください。いまの動きは見本の模擬です。</p>
</div>

<aside class="drawer" id="drawer" hidden aria-label="担当の詳しい情報"></aside>

<script>
// ===== 組織の中身（ここを書き換えると組織図が変わる） =====
// status: active=稼働中 / recent=最近 / idle=待機。hue はアイコンの色（0〜360）。
const ORG = {
  owner: { id: 'owner', name: 'あなた', role: '社長・最終決定', hue: 45,
    wishes: ['見積もりをその場で出せるようにする', 'ホームページを作り直す', '経理を毎月25日までに締める', '新しい商品の発信を週2回にする'] },
  claude: {
    lead: { id: 'an', name: 'アン', role: 'CEO・Claude Code', hue: 190, status: 'active',
      resp: '社長の指示を仕事に分けて、各部署に配る。できた物をまとめて報告する。', tasks: ['今日の段取りを配る'] },
    tools: ['メール', '予定', 'ファイル', '検索'],
    depts: [
      { name: '営業・マーケ', hue: 355, members: [
        { id: 'sora', name: 'ソラ', role: '営業', lv: 5, hue: 20, status: 'recent', resp: '問い合わせへの返事と見積もりの下書き', tasks: ['問い合わせ3件に返信', '見積もりの下書き', '商談メモの整理'] }],
        subs: [{ id: 'mkt', name: 'マーケ担当', hue: 30, status: 'active', resp: '広告と投稿の数字を見て、次の手を出す', tasks: ['週次マーケ日報', 'SNS投稿の予約', '広告の数字を確認'] }] },
      { name: '発信・文章', hue: 45, members: [
        { id: 'tsumugi', name: 'ツムギ', role: 'コンテンツ', lv: 6, hue: 330, status: 'recent', resp: 'ブログ、メルマガ、商品説明の文章', tasks: ['ブログ記事の下書き', 'メルマガ原稿', '商品説明の書き直し'] }] },
      { name: '調査', hue: 200, members: [
        { id: 'minato', name: 'ミナト', role: 'リサーチ', lv: 10, hue: 205, status: 'active', resp: '判断に要る数字と事実を集める', tasks: ['競合の価格調査', '補助金の要件を確認', '材料の値上がりを調べる'] }] },
      { name: '開発', hue: 265, members: [
        { id: 'kai', name: 'カイ', role: '開発', lv: 10, hue: 250, status: 'active', resp: '道具やページを作って直す', tasks: ['板割り計算の画面を直す', '見積もりページの試作', 'バグ報告の再現'] }] },
      { name: '品質', hue: 140, members: [
        { id: 'kohaku', name: 'コハク', role: '品質監査', lv: 5, hue: 35, status: 'recent', resp: '外に出す前の最終チェック', tasks: ['納品前チェック', '表記ゆれの確認'] }],
        subs: [
          { id: 'kenpin', name: '検品係', hue: 190, status: 'idle', resp: '画面や資料の崩れを探す', tasks: ['画面の崩れ確認', '数字の突き合わせ'] },
          { id: 'karakuchi', name: '辛口レビュアー', hue: 0, status: 'idle', resp: 'あえて厳しく読んで弱い所を指摘する', tasks: ['原稿に赤入れ', '提案書の穴探し'] },
          { id: 'dokusha', name: '読者役', hue: 120, status: 'recent', resp: '初めて読む人の気持ちで感想を言う', tasks: ['初見で読んで感想', '分かりにくい言葉を探す'] }] },
      { name: '運営', hue: 50, members: [
        { id: 'yui', name: 'ユイ', role: '番頭', lv: 7, hue: 280, status: 'active', resp: '予定、受信箱、期日の管理', tasks: ['今日の予定を整理', '受信箱の仕分け', '請求書の期日確認'] }],
        subs: [
          { id: 'hisho', name: '秘書担当', hue: 210, status: 'idle', resp: '会議や打ち合わせの日程を合わせる', tasks: ['会議日程の調整', 'リマインドを送る'] },
          { id: 'mailguard', name: '重要メール保護役', hue: 15, status: 'recent', resp: '大事なメールを見落とさないよう印を付ける', tasks: ['重要メールに印', '返信待ちの洗い出し'] },
          { id: 'mailtrash', name: '不要メール判定役', hue: 0, status: 'idle', resp: '宣伝や迷惑メールを分ける', tasks: ['迷惑メールの仕分け'] },
          { id: 'anzen', name: '最終安全確認役', hue: 50, status: 'idle', resp: '送信や支払いの前に最後の確認をする', tasks: ['送信前の最終確認', '支払い前の確認'] },
          { id: 'ouen', name: '応援（汎用）', hue: 100, status: 'idle', resp: '手が足りない所に入る', tasks: ['手が足りない所の応援'] }] },
      { name: '財務', hue: 40, cols: 2, members: [
        { id: 'towa', name: 'トワ', role: '財務の責任者', lv: 2, hue: 25, status: 'idle', resp: 'お金の流れ全体を見て月次を締める', tasks: ['月次の締め', '決算の準備'] },
        { id: 'ruka', name: 'ルカ', role: '経理', lv: 2, hue: 160, status: 'idle', resp: '領収書と帳簿', tasks: ['領収書の仕訳', '帳簿の突き合わせ'] },
        { id: 'nagi', name: 'ナギ', role: '資金繰り', lv: 2, hue: 230, status: 'idle', resp: '入金と支払いの予定表', tasks: ['入出金の予定表', '来月の資金の見通し'] },
        { id: 'ibuki', name: 'イブキ', role: '固定費', lv: 2, hue: 350, status: 'recent', resp: '家賃や契約の見直し', tasks: ['サブスクの見直し', '保険料の比較'] },
        { id: 'shion', name: 'シオン', role: '売上', lv: 1, hue: 60, status: 'idle', resp: '売上の集計と入金の確認', tasks: ['売上の集計', '未入金の確認'] }] }
    ]
  },
  codex: {
    lead: { id: 'noa', name: 'ノア', role: 'CEO・Codex', hue: 265, status: 'recent',
      resp: 'Claude Code 側の仕事を別の目で見直し、作り直しや確認を受け持つ。', tasks: ['相互レビューの返事'] },
    members: [
      { id: 'rio', name: 'リオ', role: 'ブランド・マーケ', resp: '顧客・約束・根拠・導線', hue: 40, status: 'idle', tasks: ['訴求の根拠を確認', '導線の見直し'] },
      { id: 'sena', name: 'セナ', role: 'デザイン', resp: 'AD・UI/UX・見た目の品質', hue: 330, status: 'idle', tasks: ['画面のUI案', '色と文字の見直し'] },
      { id: 'jin', name: 'ジン', role: '開発', resp: '実装・速さ・使いやすさ・保守', hue: 210, status: 'active', tasks: ['テストを書く', 'コードレビュー'] },
      { id: 'aoi', name: 'アオイ', role: '調査', resp: '判断を変える事実の確認', hue: 170, status: 'idle', tasks: ['事実確認', '出典の裏取り'] },
      { id: 'ema', name: 'エマ', role: '独立監査', resp: '制作から独立した評価', hue: 90, status: 'idle', independent: true, tasks: ['第三者の目で評価'] }
    ]
  }
};

// ===== 下ごしらえ =====
const $ = s => document.querySelector(s);
const ST = { active: '稼働中', recent: '最近', idle: '待機' };
const AG = {};             // id → 担当
const workers = [];        // 模擬で動かす担当（社長とCEOを除く）
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const hhmmss = d => hhmm(d) + ':' + pad(d.getSeconds());

function reg(a, extra) {
  Object.assign(a, extra);
  a.task = a.status === 'idle' ? '' : (a.tasks || [''])[0];
  AG[a.id] = a;
  return a;
}
const av = a => '<span class="av" style="--h:' + a.hue + '"><span>' + esc(a.name[0]) + '</span></span>';

function agentHTML(a, wide) {
  return '<article class="agent' + (wide ? ' wide' : '') + '" id="c-' + a.id + '" data-id="' + a.id + '" tabindex="0" role="button" aria-label="' + esc(a.name) + 'の詳細">' +
    av(a) + '<div class="nm">' + esc(a.name) + '</div><div class="rl">' + esc(a.role) + '</div>' +
    (wide && a.resp ? '<div class="rs">' + esc(a.resp) + '</div>' : '<div></div>') +
    '<div class="meta">' + (a.lv ? '<span class="lv">Lv.' + a.lv + '</span>' : '') +
    '<span class="st"><i class="dot"></i><span class="stt"></span></span></div><div class="task"></div></article>';
}
function subHTML(a) {
  return '<div class="sub" id="c-' + a.id + '" data-id="' + a.id + '" tabindex="0" role="button" aria-label="' + esc(a.name) + 'の詳細">' +
    '<span class="si" style="--h:' + a.hue + '"></span><span>' + esc(a.name) + '</span><i class="dot"></i></div>';
}
function leadHTML(a, eyebrow) {
  return '<article class="card lead" id="c-' + a.id + '" data-id="' + a.id + '" tabindex="0" role="button" aria-label="' + esc(a.name) + 'の詳細">' +
    av(a) + '<span class="eyebrow">' + esc(eyebrow) + '</span><div class="nm">' + esc(a.name) + '</div>' +
    '<div class="meta"><span class="st"><i class="dot"></i><span class="stt"></span></span></div><div class="task"></div></article>';
}

// ===== 組み立て =====
const O = ORG.owner, CL = ORG.claude, CX = ORG.codex;
reg(O, { status: 'active', team: '社長' });
$('#ownerRow').innerHTML = '<article class="card owner" id="c-owner" data-id="owner" tabindex="0" role="button" aria-label="やりたいことリストを見る">' +
  av(O) + '<span class="eyebrow">' + esc(O.role) + '</span><div class="nm">' + esc(O.name) + '</div><span class="wish">▤ やりたいことリスト ›</span></article>';

reg(CL.lead, { team: 'Claude Code' });
$('#claudeLeadName').textContent = '（' + CL.lead.name + '）';
$('#claudeLeadRow').innerHTML =
  '<div class="tools" id="tools"><div class="ic">' + CL.tools.map(t => '<span>' + esc(t) + '</span>').join('') + '</div><span class="tag">道具（MCP）</span></div>' +
  leadHTML(CL.lead, 'CEO · Claude Code');

$('#depts').innerHTML = CL.depts.map((d, i) => {
  const items = d.members.concat(d.subs || []);
  d.members.forEach(m => reg(m, { team: 'Claude Code', dept: d.name }));
  (d.subs || []).forEach(s => reg(s, { team: 'Claude Code', dept: d.name, isSub: true }));
  workers.push(...items);
  d.items = items;
  return '<div class="dept" id="d-' + i + '"><div class="dh" style="--h:' + d.hue + '"><b></b>' + esc(d.name) + '<em></em></div>' +
    '<div class="items" style="--cols:' + (d.cols || 1) + '">' + d.members.map(m => agentHTML(m)).join('') + (d.subs || []).map(subHTML).join('') + '</div></div>';
}).join('');

reg(CX.lead, { team: 'Codex' });
$('#codexLeadName').textContent = '（' + CX.lead.name + '）';
$('#codexLeadRow').innerHTML = leadHTML(CX.lead, 'CEO · Codex');
$('#cmembers').innerHTML = CX.members.map(m => {
  reg(m, { team: 'Codex' });
  workers.push(m);
  return (m.independent ? '<div class="indep-label">制作の列の外・独立</div>' : '') + agentHTML(m, true);
}).join('');

// ===== 線を引く =====
const chart = $('#chart'), svg = $('#wires');
let wireDefs = [];
function box(el) {
  let x = 0, y = 0, e = el;
  while (e && e !== chart) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
  return { x, y, w: el.offsetWidth, h: el.offsetHeight };
}
const curve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return 'M' + x1 + ' ' + y1 + 'C' + x1 + ' ' + m + ' ' + x2 + ' ' + m + ' ' + x2 + ' ' + y2; };
const elbow = (x, y1, y2, x2) => 'M' + x + ' ' + y1 + 'V' + (y2 - 6) + 'Q' + x + ' ' + y2 + ' ' + (x + 6) + ' ' + y2 + 'H' + x2;
const isOn = id => AG[id].status === 'active';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function drawWires() {
  const W = chart.offsetWidth, H = chart.offsetHeight;
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  wireDefs = [];
  const add = (d, cls, test, dot) => wireDefs.push({ d, cls, test, dot });
  const ow = box($('#c-owner')), cl = box($('#c-an')), cx = box($('#c-noa'));

  add(curve(ow.x + ow.w / 2, ow.y + ow.h, cl.x + cl.w / 2, cl.y), '', () => true, true);
  add(curve(ow.x + ow.w / 2 + 20, ow.y + ow.h, cx.x + cx.w / 2, cx.y), '', () => CX.members.some(m => isOn(m.id)), true);
  // Claude と Codex の相互レビュー
  const px1 = cl.x + cl.w, py1 = cl.y + cl.h / 2, px2 = cx.x, py2 = cx.y + cx.h / 2;
  add('M' + px1 + ' ' + py1 + 'C' + (px1 + 120) + ' ' + py1 + ' ' + (px2 - 120) + ' ' + py2 + ' ' + px2 + ' ' + py2, 'peer', () => false);
  const tag = $('#peerTag') || chart.appendChild(Object.assign(document.createElement('div'), { id: 'peerTag', className: 'peer-tag', textContent: '⇄ 相互レビュー・連絡' }));
  tag.style.left = (px1 + px2) / 2 + 'px'; tag.style.top = (py1 + py2) / 2 + 'px';
  // 道具
  const tb = box($('#tools').lastElementChild);
  add('M' + (tb.x + tb.w) + ' ' + (tb.y + tb.h / 2) + 'L' + cl.x + ' ' + (cl.y + cl.h * 0.7), 'tool', () => false);
  add('M' + (tb.x + tb.w) + ' ' + (tb.y - 10) + 'L' + cl.x + ' ' + (cl.y + cl.h * 0.35), 'tool', () => false);

  CL.depts.forEach((d, i) => {
    const hd = box($('#d-' + i + ' .dh'));
    add(curve(cl.x + cl.w / 2, cl.y + cl.h, hd.x + hd.w / 2, hd.y), '', () => d.items.some(a => isOn(a.id)), true);
    d.items.forEach(a => {
      const b = box($('#c-' + a.id));
      add(elbow(b.x - 8, hd.y + hd.h, b.y + Math.min(b.h / 2, 26), b.x), '', () => isOn(a.id));
    });
  });
  CX.members.forEach(m => {
    const b = box($('#c-' + m.id));
    add(elbow(b.x - 9, cx.y + cx.h, b.y + 26, b.x), m.independent ? 'indep' : '', () => isOn(m.id));
  });

  svg.innerHTML = wireDefs.map((w, i) =>
    '<g class="w ' + w.cls + '" data-i="' + i + '"><path class="base" d="' + w.d + '"/><path class="flow" d="' + w.d + '"/>' +
    (w.dot && !reduceMotion ? '<circle r="2.4"><animateMotion dur="' + (2 + (i % 3) * 0.4) + 's" repeatCount="indefinite" path="' + w.d + '"/></circle>' : '') + '</g>'
  ).join('');
  if (paused) svg.pauseAnimations();
  updateWires();
}
function updateWires() {
  svg.querySelectorAll('.w').forEach(g => g.classList.toggle('on', wireDefs[g.dataset.i].test()));
}

// ===== 札の表示を今の状態にそろえる =====
function paint(a) {
  const el = $('#c-' + a.id);
  if (!el || a.id === 'owner') return;
  el.classList.remove('s-active', 's-recent', 's-idle');
  el.classList.add('s-' + a.status);
  const stt = el.querySelector('.stt'); if (stt) stt.textContent = ST[a.status];
  const t = el.querySelector('.task');
  if (t) {
    t.textContent = a.status === 'active' ? '▸ ' + a.task : a.status === 'recent' ? '✓ 済 ' + a.task : '';
    t.title = a.task || '';
  }
  el.title = a.name + '（' + ST[a.status] + '）' + (a.task ? '：' + a.task : '');
}
function paintAll() {
  Object.values(AG).forEach(paint);
  CL.depts.forEach((d, i) => {
    const n = d.items.filter(a => a.status === 'active').length;
    const em = $('#d-' + i + ' em');
    em.textContent = n + '/' + d.items.length;
    em.classList.toggle('hot', n > 0);
  });
  $('#sActive').textContent = workers.filter(a => a.status === 'active').length;
  $('#sToday').textContent = stats.today;
  $('#sDone').textContent = stats.done;
  $('#sPeer').textContent = stats.peer;
  updateWires();
}

// ===== 数字と折れ線 =====
const now0 = new Date();
const stats = { today: 68, done: 52, peer: hhmm(new Date(now0 - 16 * 60000)) };
const spark = Array.from({ length: 24 }, (_, i) => Math.max(0, Math.round(2 + 2.2 * Math.sin((i - 6) / 3.8) + ((i * 37) % 5) - 1)));
spark[23] = 4;
function drawSpark() {
  const w = 132, h = 30, max = Math.max(...spark, 4) * 1.15;
  const pts = spark.map((n, i) => [+(i * (w - 4) / 23 + 2).toFixed(1), +(h - 3 - n / max * (h - 6)).toFixed(1)]);
  const line = pts.map(p => p.join(',')).join(' ');
  const last = pts[pts.length - 1];
  $('#spark').innerHTML =
    '<line x1="0" y1="' + (h - 3) + '" x2="' + w + '" y2="' + (h - 3) + '" stroke="#1b3247" stroke-width="1"/>' +
    '<polygon points="2,' + (h - 3) + ' ' + line + ' ' + last[0] + ',' + (h - 3) + '" fill="rgba(63,216,240,.12)"/>' +
    '<polyline points="' + line + '" fill="none" stroke="#3fd8f0" stroke-width="1.4" stroke-linejoin="round"/>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.6" fill="#bff6ff"/>';
  $('#s24').textContent = spark.reduce((s, n) => s + n, 0);
}

// ===== 最近の動き =====
const logs = [];
function log(id, text, when) {
  logs.unshift({ t: when || new Date(), id, text, fresh: !when });
  if (logs.length > 60) logs.pop();
}
function renderLog() {
  $('#log').innerHTML = logs.slice(0, 7).map(l => {
    const a = AG[l.id];
    return '<li' + (l.fresh ? ' class="new"' : '') + '><time>' + hhmmss(l.t) + '</time><span class="mini" style="--h:' + a.hue + '">' + esc(a.name[0]) + '</span><span>' + esc(a.name) + '：' + esc(l.text) + '</span></li>';
  }).join('');
  logs.forEach(l => { l.fresh = false; });
}
[['minato', '出動：' + AG.minato.task, 1], ['sora', '完了：' + AG.sora.task, 3], ['kai', '出動：' + AG.kai.task, 5], ['jin', '出動：' + AG.jin.task, 7],
 ['an', 'カイに「' + AG.kai.task + '」を振り分け', 8], ['noa', 'アンと相互レビュー', 16], ['kohaku', '完了：' + AG.kohaku.task, 21]]
  .reverse().forEach(([id, text, m]) => log(id, text, new Date(now0 - m * 60000 - 7000)));

// ===== 模擬の動き（本物のデータにつなぐ時は、ここを置き換える） =====
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function tick() {
  const activeN = workers.filter(a => a.status === 'active').length;
  const a = pick(workers);
  if (a.status === 'idle' && (activeN < 3 || Math.random() < 0.45) && activeN < 8) {
    a.status = 'active'; a.task = pick(a.tasks);
    stats.today++; spark[23]++;
    const lead = a.team === 'Codex' ? CX.lead : CL.lead;
    lead.task = a.name + 'に「' + a.task + '」'; lead.status = 'active';
    log(lead.id, a.name + 'に「' + a.task + '」を振り分け');
    log(a.id, '出動：' + a.task);
  } else if (a.status === 'active' && activeN > 2 && Math.random() < 0.5) {
    a.status = 'recent'; stats.done++;
    log(a.id, '完了：' + a.task);
  } else if (a.status === 'recent' && Math.random() < 0.35) {
    a.status = 'idle'; a.task = '';
  }
  if (Math.random() < 0.12) {
    stats.peer = hhmm(new Date());
    CX.lead.status = 'recent'; CX.lead.task = 'アンと相互レビュー';
    log('noa', 'アンと相互レビュー・連絡');
    const g = svg.querySelector('.w.peer');
    if (g) { g.classList.add('flash'); setTimeout(() => g.classList.remove('flash'), 1800); }
  }
  paintAll(); drawSpark(); renderLog();
  if (openId) openDrawer(openId);
}

// ===== 詳しく見る =====
let openId = null;
const drawer = $('#drawer');
function openDrawer(id) {
  const a = AG[id]; openId = id;
  let body;
  if (id === 'owner') {
    body = '<h4>やりたいことリスト</h4><ul>' + O.wishes.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul>';
  } else {
    const mine = logs.filter(l => l.id === id).slice(0, 6);
    body = '<dl><dt>状態</dt><dd>' + ST[a.status] + '</dd>' +
      (a.lv ? '<dt>レベル</dt><dd>Lv.' + a.lv + '</dd>' : '') +
      '<dt>所属</dt><dd>' + esc(a.team + (a.dept ? '・' + a.dept : '')) + '</dd>' +
      '<dt>今の仕事</dt><dd>' + (a.status === 'active' ? esc(a.task) : a.status === 'recent' ? '済：' + esc(a.task) : 'なし') + '</dd>' +
      '<dt>担当範囲</dt><dd>' + esc(a.resp || '') + '</dd></dl>' +
      '<h4>よく受ける仕事</h4><ul>' + a.tasks.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
      '<h4>最近の記録</h4>' + (mine.length ? '<ul>' + mine.map(l => '<li><time>' + hhmm(l.t) + '</time>' + esc(l.text) + '</li>').join('') + '</ul>' : '<p class="note">まだ記録はありません。</p>');
  }
  drawer.innerHTML = '<div class="hd"><span class="av big" style="--h:' + a.hue + '"><span>' + esc(a.name[0]) + '</span></span>' +
    '<div><h3>' + esc(a.name) + '</h3><p>' + esc(a.role) + '</p></div><button class="x" id="closeDrawer" type="button" aria-label="閉じる">×</button></div>' + body;
  drawer.hidden = false;
  $('#closeDrawer').onclick = closeDrawer;
}
function closeDrawer() { drawer.hidden = true; openId = null; }
chart.addEventListener('click', e => { const el = e.target.closest('[data-id]'); if (el) { openDrawer(el.dataset.id); $('#closeDrawer').focus(); } });
chart.addEventListener('keydown', e => { const el = e.target.closest('[data-id]'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(el.dataset.id); $('#closeDrawer').focus(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });

// ===== 全体表示と等倍 =====
let fitMode = true;
function fit() {
  const vw = $('#viewport').clientWidth, cw = chart.offsetWidth, ch = chart.offsetHeight;
  const s = fitMode ? Math.min(1, vw / cw) : 1;
  chart.style.transform = s < 1 ? 'scale(' + s + ')' : '';
  $('#stage').style.width = cw * s + 'px';
  $('#stage').style.height = ch * s + 'px';
  $('#fit').textContent = fitMode ? '等倍で見る' : '全体を表示';
  $('#fit').disabled = vw >= cw;
}
$('#fit').onclick = () => { fitMode = !fitMode; fit(); };

// ===== 止める・動かす =====
let paused = false, timer = null;
function start() { timer = setInterval(tick, 2400); }
$('#pause').onclick = () => {
  paused = !paused;
  document.body.classList.toggle('paused', paused);
  $('#pause').textContent = paused ? '動きを再開' : '動きを止める';
  $('#pause').setAttribute('aria-pressed', paused);
  $('#liveText').textContent = paused ? '停止中' : 'LIVE';
  if (paused) { clearInterval(timer); svg.pauseAnimations(); } else { start(); svg.unpauseAnimations(); }
};

// ===== 時計 =====
const clock = () => { $('#clock').textContent = hhmmss(new Date()); };
setInterval(clock, 1000);

// ===== はじめの表示 =====
clock(); paintAll(); drawWires(); drawSpark(); renderLog(); fit(); start();
const relayout = () => { drawWires(); fit(); };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(relayout, 120); });
</script>
</body>
