<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>事務所の組織図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 色の決まり。銀色の金属と、銀行の書類のような紺 */
:root {
  color-scheme: light;
  --ink: #1c2633; --sub: #56616e; --faint: #8a939e;
  --navy: #1f3d66; --navy-dk: #142a4a; --aqua: #2f7fd8; --ok: #2f9a45;
  --edge: #a3abb5; --edge-dk: #7f8893; --wire: #98a2ad;
  --plate: linear-gradient(180deg, #fdfdfe 0%, #eef0f3 55%, #e1e5ea 100%);
  --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; padding-block: 14px 32px; padding-inline: 16px;
  color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55;
  background-color: #d6dade;
  /* ヘアライン加工の金属 */
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.22) 0 1px, rgba(0,0,0,.022) 1px 2px, rgba(255,255,255,0) 2px 3px),
    linear-gradient(180deg, #eceef1 0%, #d3d8dd 60%, #c8cdd3 100%);
  background-attachment: fixed;
}
button { font-family: inherit; color: var(--ink); cursor: pointer; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
.engrave { text-shadow: 0 1px 0 rgba(255,255,255,.85); }

/* ===== 上の道具帯 ===== */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding: 10px 14px; margin-bottom: 14px; border: 1px solid #959ea9; border-radius: 12px;
  background: linear-gradient(180deg, #f7f8fa 0%, #e2e6ea 50%, #d4d9df 51%, #e6e9ed 100%);
  box-shadow: inset 0 1px 0 #fff, 0 2px 8px rgba(20,30,45,.14);
}
.title { display: grid; line-height: 1.2; }
.title h1 { margin: 0; font: 800 20px var(--serif); color: var(--navy-dk); letter-spacing: .08em; text-shadow: 0 1px 0 #fff; }
.title small { font-size: 10.5px; color: var(--sub); letter-spacing: .1em; }
.mode { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--sub); }
#clock { font: 600 22px var(--serif); font-variant-numeric: tabular-nums; color: var(--navy-dk); text-shadow: 0 1px 0 #fff; letter-spacing: .03em; }
.pill {
  font-size: 12px; min-height: 30px; padding: 4px 14px; border-radius: 999px; border: 1px solid #8c95a0;
  background: linear-gradient(180deg, #ffffff 0%, #eef0f3 48%, #dde1e6 52%, #f1f3f5 100%);
  box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.15); text-shadow: 0 1px 0 #fff;
}
.pill:hover { border-color: var(--aqua); }
.pill:active { background: linear-gradient(180deg, #d9dde2, #eceff2); }
.pill[aria-pressed="true"] { color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.3); border-color: #1d5fae;
  background: linear-gradient(180deg, #8ec1f5 0%, #4b95e6 48%, #2f7fd8 52%, #62a8ee 100%); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.well {
  min-width: 92px; padding: 4px 12px 5px; border-radius: 7px;
  background: linear-gradient(180deg, #e0e4e9, #f6f7f9);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.28), 0 1px 0 #fff;
}
.well span { display: block; font-size: 10px; color: var(--sub); letter-spacing: .06em; }
.well b { font: 600 20px var(--serif); font-variant-numeric: tabular-nums; color: var(--navy); }
.spark { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 10px; color: var(--sub); }
.spark b { font: 600 13px var(--serif); color: var(--navy); }
.spark svg { width: 136px; height: 32px; display: block; border-radius: 5px;
  background: linear-gradient(180deg, #e0e4e9, #f6f7f9); box-shadow: inset 0 1px 3px rgba(0,0,0,.25), 0 1px 0 #fff; }

/* ===== ランプ（状態） ===== */
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff 0 16%, #c3c9d0 38%, #8b949f 100%);
  box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
.s-active .dot { background: radial-gradient(circle at 35% 30%, #fff 0 14%, #7fe08c 34%, #238a39 100%); box-shadow: 0 0 0 1px rgba(0,60,20,.3), 0 0 7px rgba(47,154,69,.75); animation: glow 1.8s ease-in-out infinite; }
.s-recent .dot { background: radial-gradient(circle at 35% 30%, #fff 0 14%, #86c0f7 34%, #2467b8 100%); box-shadow: 0 0 0 1px rgba(10,40,90,.3); }
.s-live .dot { background: radial-gradient(circle at 35% 30%, #fff 0 14%, #7fe08c 34%, #238a39 100%); }
@keyframes glow { 50% { box-shadow: 0 0 0 1px rgba(0,60,20,.3), 0 0 2px rgba(47,154,69,.3); } }

/* ===== 組織図の枠 ===== */
.viewport { overflow: auto; border-radius: 14px; border: 1px solid #a7afb8;
  background: linear-gradient(180deg, #cfd4da, #dde1e5 30%, #e4e7eb);
  box-shadow: inset 0 2px 8px rgba(0,0,0,.2), 0 1px 0 rgba(255,255,255,.8); -webkit-overflow-scrolling: touch; }
.stage { position: relative; }
.chart { position: relative; width: max-content; padding: 34px 36px 36px; transform-origin: 0 0; }
.wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.wires path { fill: none; stroke-width: 1.5; }
.w .base { stroke: var(--wire); }
.w .flow { display: none; stroke: rgba(255,255,255,.95); stroke-width: 1.5; stroke-dasharray: 2 10; animation: flow 1.1s linear infinite; }
.w.on .base { stroke: var(--aqua); stroke-width: 2; }
.w.on .flow { display: inline; }
.w circle { display: none; fill: #fff; stroke: var(--aqua); stroke-width: 1.5; }
.w.on circle { display: inline; }
@keyframes flow { to { stroke-dashoffset: -12; } }

.row { display: flex; justify-content: center; }
.tray { margin-top: 44px; padding: 16px 22px 26px; border-radius: 16px; border: 1px solid #aab2bb;
  background: linear-gradient(180deg, #d9dde2, #e6e9ec); box-shadow: inset 0 2px 6px rgba(0,0,0,.16), 0 1px 0 #fff; }
.tray h2 { margin: 0; font: 800 15px var(--serif); color: var(--navy-dk); letter-spacing: .12em; text-shadow: 0 1px 0 #fff; }
.tray h2 small { font: 400 11px var(--sans); color: var(--sub); letter-spacing: 0; margin-left: 8px; }

/* ===== 札 ===== */
.plate { position: relative; z-index: 1; cursor: pointer; border: 1px solid var(--edge); border-radius: 9px; background: var(--plate);
  box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(20,30,45,.2), 0 4px 10px rgba(20,30,45,.07);
  transition: border-color .3s, box-shadow .3s, opacity .3s; }
.plate:hover { border-color: var(--aqua); }
.plate.s-active { border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(47,127,216,.2), inset 0 1px 0 #fff, 0 3px 10px rgba(47,127,216,.3); }
.plate.s-idle { opacity: .82; }
.owner { width: 230px; padding: 10px 50px 11px 14px; color: #fff; border-color: var(--navy-dk);
  background: linear-gradient(180deg, #3a5c8c 0%, #23426d 52%, #1a355a 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 8px rgba(20,40,70,.35); }
.owner .eyebrow { color: #c9d6e8; }
.owner .nm { font: 800 20px var(--serif); text-shadow: 0 -1px 0 rgba(0,0,0,.35); padding: 0; }
.owner .order { font-size: 10.5px; color: #dfe8f4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lead { width: 230px; padding: 10px 50px 10px 14px; border: 2px solid var(--navy); }
.lead .nm { font: 800 19px var(--serif); color: var(--navy-dk); padding: 0; }
.eyebrow { display: block; font-size: 9.5px; letter-spacing: .14em; color: var(--sub); }
.agent { width: 164px; height: 106px; padding: 9px 11px 8px; display: grid; grid-template-rows: auto auto 1fr auto; }
.nm { font-weight: 700; font-size: 14px; padding-right: 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 #fff; }
.rl { font-size: 10.5px; color: var(--sub); line-height: 1.35; }
.meta { display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: var(--sub); align-self: end; }
.lv { font: 600 10px var(--serif); color: var(--navy); border: 1px solid #b7bec7; border-radius: 4px; padding: 0 5px; background: #f4f6f8; }
.st { display: inline-flex; align-items: center; gap: 5px; }
.task { font-size: 10.5px; margin-top: 3px; min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--faint); }
.s-active .task { color: var(--aqua); font-weight: 500; }
.s-recent .task { color: var(--navy); }

/* 丸いバッジ（昔のガラス玉のボタン） */
.av { position: absolute; top: -12px; right: -10px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  font: 800 14px var(--serif); color: #fff; text-shadow: 0 -1px 1px rgba(0,0,0,.45); letter-spacing: -.02em;
  background: radial-gradient(circle at 50% 120%, hsl(var(--h) 70% 72%) 0%, hsl(var(--h) 55% 46%) 45%, hsl(var(--h) 60% 28%) 100%);
  border: 1px solid hsl(var(--h) 45% 25%); box-shadow: 0 2px 4px rgba(0,0,0,.3), inset 0 -2px 4px rgba(255,255,255,.25); overflow: hidden; }
.av::before { content: ""; position: absolute; left: 14%; right: 14%; top: 4%; height: 46%; border-radius: 50% 50% 45% 45%;
  background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.08)); }
.av span { position: relative; }
.owner .av, .lead .av { width: 44px; height: 44px; font-size: 16px; top: -15px; right: -13px; }

/* ===== 部署 ===== */
.depts { display: flex; gap: 16px; align-items: flex-start; margin-top: 54px; }
.dh { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px;
  font: 800 12.5px var(--serif); letter-spacing: .1em; color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.4); border: 1px solid var(--navy-dk);
  background: linear-gradient(180deg, #4d6d99 0%, #2a4b77 50%, #1f3d66 51%, #2b4b76 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 1px 2px rgba(0,0,0,.25); }
.dh em { margin-left: auto; font: 600 11px var(--sans); font-style: normal; letter-spacing: 0; color: #c9d6e8; }
.dh em.hot { color: #fff; }
.items { display: grid; gap: 20px; padding: 22px 0 0 14px; }

/* ===== 最近の動き（通帳ふう） ===== */
.below { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 16px; }
.book { border: 1px solid #a3abb5; border-radius: 12px; overflow: hidden; background: #fbfcfd; box-shadow: 0 2px 8px rgba(20,30,45,.12); }
.book header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 9px 14px; border-bottom: 1px solid #a3abb5;
  background: linear-gradient(180deg, #f7f8fa 0%, #e2e6ea 50%, #d4d9df 51%, #e6e9ed 100%); }
.book h3 { margin: 0; font: 800 14px var(--serif); color: var(--navy-dk); letter-spacing: .12em; text-shadow: 0 1px 0 #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--sub); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.book ol { list-style: none; margin: 0; padding: 0; }
.book li { display: grid; grid-template-columns: 70px 22px minmax(0, 1fr); align-items: center; gap: 10px; padding: 6px 14px; font-size: 13px;
  border-bottom: 1px solid #d5dde7; background: #fff; }
.book li:nth-child(even) { background: #f3f6fa; }
.book li:last-child { border-bottom: 0; }
.book li time { font: 600 12px var(--serif); color: var(--sub); font-variant-numeric: tabular-nums; }
.book li .mini { position: relative; top: 0; right: 0; width: 22px; height: 22px; font-size: 10px; }
.book li.new { animation: fresh 1.2s ease; }
.book .empty { padding: 12px 14px; color: var(--sub); font-size: 13px; }
@keyframes fresh { from { background: #dcebfb; } }
.note { font-size: 11.5px; color: var(--sub); margin: 0; text-shadow: 0 1px 0 rgba(255,255,255,.7); }

/* ===== 詳しく見る ===== */
.drawer { position: fixed; z-index: 10; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100% - 32px)); overflow-y: auto; padding: 18px; border-radius: 14px; border: 1px solid #8c95a0;
  background: linear-gradient(180deg, #fbfcfd, #eceff2); box-shadow: 0 16px 40px rgba(20,30,45,.35), inset 0 1px 0 #fff; }
.drawer .hd { display: flex; align-items: center; gap: 12px; }
.drawer .big { position: relative; top: 0; right: 0; width: 54px; height: 54px; font-size: 19px; flex: none; }
.drawer h3 { margin: 0; font: 800 20px var(--serif); color: var(--navy-dk); }
.drawer .hd p { margin: 0; font-size: 12px; color: var(--sub); }
.drawer .x { margin-left: auto; align-self: flex-start; width: 34px; height: 34px; padding: 0; font-size: 16px; }
.drawer dl { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px 12px; margin: 16px 0; font-size: 13px; }
.drawer dt { color: var(--sub); font-size: 11.5px; }
.drawer dd { margin: 0; overflow-wrap: anywhere; }
.drawer h4 { font: 800 12.5px var(--serif); color: var(--navy); letter-spacing: .1em; margin: 16px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #c3cad3; }
.drawer ul { margin: 0; padding-left: 1.1em; font-size: 12.5px; display: grid; gap: 4px; }
.drawer ul time { font: 600 11px var(--serif); color: var(--sub); margin-right: 6px; }
.drawer .report { font-size: 12.5px; white-space: pre-wrap; background: #fff; border: 1px solid #d0d6dd; border-radius: 8px; padding: 8px 10px; margin: 0; }

@media (max-width: 600px) {
  .drawer { top: auto; left: 16px; right: 16px; width: auto; max-height: 72%; }
  .spark { margin-left: 0; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; }
  .well { min-width: 0; padding: 4px 7px; }
  .well span { font-size: 9px; line-height: 1.3; }
  .well b { font-size: 16px; }
}
.paused .flow, .paused .dot { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .w circle { display: none !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="title"><h1>事務所の組織図</h1><small id="modeText">見本の動き</small></div>
  <span class="mode s-idle" id="modeLamp"><i class="dot"></i><span id="modeLabel">記録なし</span></span>
  <time id="clock">--:--:--</time>
  <button id="pause" class="pill" type="button" aria-pressed="false">動きを止める</button>
  <div class="stats">
    <div class="well"><span>稼働中の担当</span><b id="sActive">0</b></div>
    <div class="well"><span>今日の出動</span><b id="sToday">0</b></div>
    <div class="well"><span>今日の完了</span><b id="sDone">0</b></div>
    <div class="well"><span>最後の報告</span><b id="sReport">--:--</b></div>
  </div>
  <div class="spark">
    <span>24時間の出動<br><b id="s24">0</b> 回</span>
    <svg id="spark" viewBox="0 0 136 32" role="img" aria-label="24時間の出動回数の推移"></svg>
  </div>
  <button id="fit" class="pill" type="button">等倍で見る</button>
</header>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <div class="chart" id="chart">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <div class="row" id="ownerRow"></div>
      <section class="tray" aria-label="事務チーム">
        <h2>事務チーム<small>Claude Code</small></h2>
        <div class="row" id="leadRow"></div>
        <div class="depts" id="depts"></div>
      </section>
    </div>
  </div>
</div>

<div class="below">
  <section class="book" aria-live="polite">
    <header>
      <h3>最近の動き</h3>
      <div class="legend">
        <span class="s-active"><i class="dot"></i>稼働中</span>
        <span class="s-recent"><i class="dot"></i>最近（仕事を終えた）</span>
        <span class="s-idle"><i class="dot"></i>待機</span>
      </div>
    </header>
    <ol id="log"></ol>
  </section>
  <p class="note" id="note"></p>
</div>

<aside class="drawer" id="drawer" hidden aria-label="担当の詳しい情報"></aside>

<script>
// ===== 組織の中身 =====
// id は .claude/agents/ のファイル名（name）と同じにする。
// 同じ係を増やした時（例：mail-b）は、ここに書かなくても、動いた時に自動で同じ部署に並ぶ。
// tasks と status は、記録がまだ無い時の「見本の動き」にだけ使う。
const ORG = {
  owner: { id: 'owner', name: 'あなた', role: '社長・最終決定', hue: 42 },
  lead: { id: 'matome', name: 'まとめ役', role: '事務の取りまとめ', hue: 215, status: 'active',
    resp: '社長の頼みごとを担当ごとの仕事に分けて割り振り、まとめて報告する。', tasks: ['頼まれた仕事を割り振る'] },
  depts: [
    { name: '受付・メール', members: [
      { id: 'mail-a', name: 'メール係A', role: 'メールの仕分けと返信の下書き', hue: 200, status: 'active',
        resp: 'メールを「急ぎ・返事が要る・読むだけ・不要」に分け、返信の下書きを作る。送信はしない。', tasks: ['受信メール12件の仕分け', '見積もりお礼の返信下書き', '日程の問い合わせに返信下書き'] }] },
    { name: '秘書', members: [
      { id: 'secretary-a', name: '秘書A', role: '予定・日程調整・やること', hue: 280, status: 'recent',
        resp: '予定を日付順に整理し、日程調整の文面と、やることリストを作る。', tasks: ['来週の予定を整理', '打ち合わせ候補日の文面', 'やることリストの更新'] }] },
    { name: '書類', members: [
      { id: 'docs-a', name: '書類係A', role: '見積書・請求書・納品書', hue: 30, status: 'active',
        resp: 'ひな形から見積書・請求書・納品書を作り、請求一覧に書き足す。', tasks: ['請求書を3件作る', '山田工務店の見積書', '納品書の作成'] },
      { id: 'filing-a', name: '整理係A', role: '名前付けと保管', hue: 170, status: 'idle',
        resp: '済んだ物に名前を付け、年と月ごとのフォルダにしまう。消さずに移すだけ。', tasks: ['9月分の書類を保管', '領収書の名前をそろえる'] }] },
    { name: '経理', members: [
      { id: 'keiri-a', name: '経理A', role: '経費の記録と月の集計', hue: 140, status: 'recent',
        resp: '領収書を読み取って経費の帳簿に記録し、勘定科目ごとに集計する。', tasks: ['レシート8枚を記録', '9月の経費を集計', 'インボイス番号の確認'] },
      { id: 'payment-a', name: '入金・支払い係A', role: '入金確認と支払い期日', hue: 350, status: 'idle',
        resp: '入金を請求と突き合わせ、支払い期日の一覧を作る。支払いはしない。', tasks: ['入金3件を突き合わせ', '今週払うものの一覧', '未入金の洗い出し'] }] },
    { name: '確認', members: [
      { id: 'check-a', name: '確認係A', role: '外に出す前の最終確認', hue: 0, status: 'idle',
        resp: '宛先・金額・日付・誤字を確かめ、直す所を指摘する。自分では直さない。', tasks: ['請求書3件の最終確認', '返信下書きの確認'] }] }
  ]
};

// ===== 下ごしらえ =====
const $ = s => document.querySelector(s);
const ST = { active: '稼働中', recent: '最近', idle: '待機' };
const AG = {}, workers = [];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const hhmmss = d => hhmm(d) + ':' + pad(d.getSeconds());
// バッジの文字：「メール係A」→「メA」、「まとめ役」→「ま」
const mark = a => a.name[0] + (/[A-Z]$/.test(a.name) ? a.name.slice(-1) : '');
const badge = (a, cls = '') => '<span class="av ' + cls + '" style="--h:' + a.hue + '"><span>' + esc(mark(a)) + '</span></span>';
const OTHER = { 'general-purpose': '手伝い（汎用）', Explore: '探し物係', Plan: '段取り係' };
const who = id => AG[id] || { id, name: OTHER[id] || id, role: '', hue: 210 };

function reg(a, dept) {
  a.dept = dept; a.lv = a.lv || 1; a.done = 0;
  a.task = a.status === 'idle' ? '' : (a.tasks || [''])[0];
  AG[a.id] = a;
  if (dept) workers.push(a);
}
reg(ORG.owner, null); reg(ORG.lead, null);
ORG.depts.forEach(d => d.members.forEach(m => reg(m, d.name)));

// 増えた担当（例：mail-b）を、同じ係（mail-a）の部署に加える
function ensureAgent(id) {
  if (AG[id]) return AG[id];
  const m = /^(.+)-([a-z])$/.exec(id || '');
  if (!m) return null;
  for (const d of ORG.depts) {
    const base = d.members.find(x => x.id.startsWith(m[1] + '-'));
    if (!base) continue;
    const a = { id, name: base.name.replace(/[A-Z]$/, '') + m[2].toUpperCase(), role: base.role, hue: base.hue, resp: base.resp, tasks: base.tasks, status: 'idle' };
    d.members.push(a);
    d.members.sort((x, y) => x.id.localeCompare(y.id));
    reg(a, d.name);
    return a;
  }
  return null;
}

// ===== 組み立て =====
const chart = $('#chart'), svg = $('#wires');
function agentHTML(a) {
  return '<article class="plate agent" id="c-' + a.id + '" data-id="' + a.id + '" tabindex="0" role="button" aria-label="' + esc(a.name) + 'の詳細">' +
    badge(a) + '<div class="nm">' + esc(a.name) + '</div><div class="rl">' + esc(a.role) + '</div><div></div>' +
    '<div class="meta"><span class="lv"></span><span class="st"><i class="dot"></i><span class="stt"></span></span></div><div class="task"></div></article>';
}
function build() {
  const O = ORG.owner, L = ORG.lead;
  $('#ownerRow').innerHTML = '<article class="plate owner" id="c-owner" data-id="owner" tabindex="0" role="button" aria-label="社長の指示の記録を見る">' +
    badge(O) + '<span class="eyebrow">' + esc(O.role) + '</span><div class="nm">' + esc(O.name) + '</div><div class="order" id="lastOrder"></div></article>';
  $('#leadRow').innerHTML = '<article class="plate lead" id="c-matome" data-id="matome" tabindex="0" role="button" aria-label="まとめ役の詳細">' +
    badge(L) + '<span class="eyebrow">事務の取りまとめ</span><div class="nm">' + esc(L.name) + '</div>' +
    '<div class="meta"><span class="st"><i class="dot"></i><span class="stt"></span></span></div><div class="task"></div></article>';
  $('#depts').innerHTML = ORG.depts.map((d, i) =>
    '<div class="dept" id="d-' + i + '"><div class="dh">' + esc(d.name) + '<em></em></div><div class="items">' + d.members.map(agentHTML).join('') + '</div></div>'
  ).join('');
}

// ===== 線を引く =====
let wireDefs = [];
function box(el) {
  let x = 0, y = 0, e = el;
  while (e && e !== chart) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
  return { x, y, w: el.offsetWidth, h: el.offsetHeight };
}
const curve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return 'M' + x1 + ' ' + y1 + 'C' + x1 + ' ' + m + ' ' + x2 + ' ' + m + ' ' + x2 + ' ' + y2; };
const elbow = (x, y1, y2, x2) => 'M' + x + ' ' + y1 + 'V' + (y2 - 6) + 'Q' + x + ' ' + y2 + ' ' + (x + 6) + ' ' + y2 + 'H' + x2;
const isOn = id => AG[id].status === 'active';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function drawWires() {
  const W = chart.offsetWidth, H = chart.offsetHeight;
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  wireDefs = [];
  const add = (d, test, dot) => wireDefs.push({ d, test, dot });
  const ow = box($('#c-owner')), ld = box($('#c-matome'));
  add(curve(ow.x + ow.w / 2, ow.y + ow.h, ld.x + ld.w / 2, ld.y), () => ORG.lead.status === 'active', true);
  ORG.depts.forEach((d, i) => {
    const hd = box($('#d-' + i + ' .dh'));
    add(curve(ld.x + ld.w / 2, ld.y + ld.h, hd.x + hd.w / 2, hd.y), () => d.members.some(a => isOn(a.id)), true);
    d.members.forEach(a => {
      const b = box($('#c-' + a.id));
      add(elbow(b.x - 8, hd.y + hd.h, b.y + 26, b.x), () => isOn(a.id));
    });
  });
  svg.innerHTML = wireDefs.map((w, i) =>
    '<g class="w" data-i="' + i + '"><path class="base" d="' + w.d + '"/><path class="flow" d="' + w.d + '"/>' +
    (w.dot && !reduceMotion ? '<circle r="3"><animateMotion dur="' + (2.2 + (i % 3) * 0.4) + 's" repeatCount="indefinite" path="' + w.d + '"/></circle>' : '') + '</g>'
  ).join('');
  if (paused) svg.pauseAnimations();
  updateWires();
}
function updateWires() {
  svg.querySelectorAll('.w').forEach(g => g.classList.toggle('on', wireDefs[g.dataset.i].test()));
}

// ===== 札を今の状態にそろえる =====
function paint(a) {
  const el = $('#c-' + a.id);
  if (!el || a.id === 'owner') return;
  el.classList.remove('s-active', 's-recent', 's-idle');
  el.classList.add('s-' + a.status);
  el.querySelector('.stt').textContent = ST[a.status];
  const lv = el.querySelector('.lv'); if (lv) lv.textContent = 'Lv.' + a.lv;
  const t = el.querySelector('.task');
  t.textContent = a.status === 'active' ? '▸ ' + a.task : a.status === 'recent' && a.task ? '✓ 済 ' + a.task : '';
  el.title = a.name + '（' + ST[a.status] + '）' + (a.task ? '：' + a.task : '');
}
function paintAll() {
  [ORG.lead, ...workers].forEach(paint);
  $('#lastOrder').textContent = ORG.owner.lastOrder ? '指示：' + ORG.owner.lastOrder : 'まだ指示はありません';
  ORG.depts.forEach((d, i) => {
    const n = d.members.filter(a => a.status === 'active').length;
    const em = $('#d-' + i + ' em');
    em.textContent = n + '/' + d.members.length;
    em.classList.toggle('hot', n > 0);
  });
  $('#sActive').textContent = workers.filter(a => a.status === 'active').length;
  $('#sToday').textContent = stats.today;
  $('#sDone').textContent = stats.done;
  $('#sReport').textContent = stats.report;
  updateWires();
}

// ===== 数字と折れ線 =====
const stats = { today: 0, done: 0, report: '--:--' };
const spark = new Array(24).fill(0);
function drawSpark() {
  const w = 136, h = 32, base = h - 4, max = Math.max(...spark, 3) * 1.15;
  const pts = spark.map((n, i) => [+(i * (w - 8) / 23 + 4).toFixed(1), +(base - n / max * (h - 9)).toFixed(1)]);
  const line = pts.map(p => p.join(',')).join(' ');
  const last = pts[pts.length - 1];
  $('#spark').innerHTML =
    '<line x1="4" y1="' + base + '" x2="' + (w - 4) + '" y2="' + base + '" stroke="#b7bec7" stroke-width="1"/>' +
    '<polygon points="4,' + base + ' ' + line + ' ' + last[0] + ',' + base + '" fill="rgba(31,61,102,.13)"/>' +
    '<polyline points="' + line + '" fill="none" stroke="#1f3d66" stroke-width="1.4" stroke-linejoin="round"/>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.8" fill="#2f7fd8" stroke="#fff" stroke-width="1"/>';
  $('#s24').textContent = spark.reduce((s, n) => s + n, 0);
}

// ===== 最近の動き =====
const logs = [];
let seenT = 0;
function renderLog() {
  const rows = logs.slice(0, 8);
  $('#log').innerHTML = rows.length ? rows.map(l => {
    const a = who(l.id);
    return '<li' + (l.t > seenT && seenT ? ' class="new"' : '') + '><time>' + hhmmss(new Date(l.t)) + '</time>' + badge(a, 'mini') +
      '<span>' + esc(a.name) + '：' + esc(l.text) + '</span></li>';
  }).join('') : '<li class="empty">まだ記録はありません。Claude Code で仕事を頼むと、ここに出ます。</li>';
  seenT = logs.length ? logs[0].t : seenT || 1;
}

// ===== 本物の記録（activity.js）を読む =====
// 記録係（.claude/hooks/activity.mjs）が書いた記録から、今の状態を組み立て直す。
let live = false;
function applyEvents(ev) {
  const now = Date.now(), day0 = new Date().setHours(0, 0, 0, 0);
  const before = workers.length;
  ev.forEach(e => { if (e.agent && e.agent !== 'owner' && e.agent !== 'matome') ensureAgent(e.agent); });
  if (workers.length !== before) relayout(true);

  workers.forEach(a => { a.status = 'idle'; a.task = ''; a.done = 0; a.doneAt = 0; a.report = ''; });
  const open = new Map(), lastTask = {};
  const L = ORG.lead;
  L.status = 'idle'; L.task = ''; L.report = '';
  let lastReport = 0;
  logs.length = 0; stats.today = 0; stats.done = 0; spark.fill(0);
  ORG.owner.lastOrder = ''; ORG.owner.orders = [];

  for (const e of ev) {
    const a = AG[e.agent], name = who(e.agent).name;
    const hrs = Math.floor((now - e.t) / 3600000);
    if (e.type === 'order') {
      L.status = 'active'; L.task = '指示を整理';
      ORG.owner.lastOrder = e.text; ORG.owner.orders.unshift({ t: e.t, text: e.text });
      logs.unshift({ t: e.t, id: 'owner', text: '指示「' + e.text + '」' });
    } else if (e.type === 'assign') {
      lastTask[e.agent] = e.text; L.task = name + 'に「' + e.text + '」';
      logs.unshift({ t: e.t, id: 'matome', text: name + 'に「' + e.text + '」を割り振り' });
    } else if (e.type === 'start') {
      open.set(e.id || e.agent, e);
      if (e.t >= day0) stats.today++;
      if (hrs < 24) spark[23 - hrs]++;
      logs.unshift({ t: e.t, id: e.agent, text: '出動' + (lastTask[e.agent] ? '：' + lastTask[e.agent] : '') });
    } else if (e.type === 'done') {
      open.delete(e.id || e.agent);
      if (a) { a.status = 'recent'; a.doneAt = e.t; a.task = lastTask[e.agent] || ''; a.done++; a.report = e.text; }
      if (e.t >= day0) stats.done++;
      logs.unshift({ t: e.t, id: e.agent, text: '完了' + (lastTask[e.agent] ? '：' + lastTask[e.agent] : '') });
    } else if (e.type === 'report') {
      L.status = 'recent'; L.task = '社長に報告'; L.report = e.text; lastReport = e.t;
      logs.unshift({ t: e.t, id: 'matome', text: '社長に報告' });
    }
  }
  for (const e of open.values()) {
    const a = AG[e.agent];
    if (a && now - e.t < 45 * 60000) { a.status = 'active'; a.task = lastTask[e.agent] || '作業中'; }
  }
  workers.forEach(a => {
    if (a.status === 'recent' && now - a.doneAt > 60 * 60000) { a.status = 'idle'; a.task = ''; }
    a.lv = 1 + Math.floor(a.done / 3); // 3回終えるごとに1つ上がる
  });
  if (workers.some(a => a.status === 'active')) L.status = 'active';
  if (L.status === 'recent' && now - lastReport > 60 * 60000) L.status = 'idle';
  stats.report = lastReport ? hhmm(new Date(lastReport)) : '--:--';
  if (logs.length > 80) logs.length = 80;
  paintAll(); drawSpark(); renderLog();
  if (openId) openDrawer(openId);
}
function goLive() {
  live = true;
  clearInterval(simTimer);
  $('#modeText').textContent = 'Claude Code とつながっています';
  $('#modeLabel').textContent = '記録を読んでいます';
  $('#modeLamp').className = 'mode s-live';
  $('#note').textContent = '担当が動くと、数秒で画面に出ます。札を押すと、その担当の仕事と最後の報告が見られます。';
}
let misses = 0;
function poll() {
  if (paused) return;
  const s = document.createElement('script');
  s.src = 'activity.js?t=' + Date.now();
  s.onload = () => {
    s.remove();
    if (Array.isArray(window.ACTIVITY)) { if (!live) goLive(); applyEvents(window.ACTIVITY); }
  };
  s.onerror = () => { s.remove(); misses++; };
  document.head.appendChild(s);
}

// ===== 見本の動き（記録がまだ無い時だけ） =====
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function seedDemo() {
  const now = Date.now();
  stats.today = 23; stats.done = 19; stats.report = hhmm(new Date(now - 6 * 60000));
  [1, 0, 0, 0, 0, 0, 0, 1, 3, 5, 4, 2, 4, 6, 3, 2, 1, 0, 0, 0, 0, 0, 0, 2].forEach((n, i) => { spark[i] = n; });
  workers.forEach(a => { a.lv = 1 + (a.id.length % 4); });
  ORG.owner.lastOrder = '今週の請求書を作って、メールも片付けて';
  ORG.owner.orders = [{ t: now - 9 * 60000, text: ORG.owner.lastOrder }];
  [[9, 'owner', '指示「' + ORG.owner.lastOrder + '」'], [8, 'matome', '書類係Aに「請求書を3件作る」を割り振り'], [8, 'docs-a', '出動：請求書を3件作る'],
   [7, 'mail-a', '出動：受信メール12件の仕分け'], [6, 'keiri-a', '完了：レシート8枚を記録'], [4, 'secretary-a', '完了：来週の予定を整理']]
    .forEach(([m, id, text]) => logs.unshift({ t: now - m * 60000, id, text }));
  $('#note').textContent = 'いまは見本の動きです。Claude Code で仕事を頼むと、本物の記録に切り替わります。札を押すと、その担当の仕事が見られます。';
}
function tick() {
  if (live) return;
  const activeN = workers.filter(a => a.status === 'active').length;
  const a = pick(workers), now = Date.now();
  if (a.status === 'idle' && (activeN < 2 || Math.random() < 0.45) && activeN < 5) {
    a.status = 'active'; a.task = pick(a.tasks);
    stats.today++; spark[23]++;
    ORG.lead.status = 'active'; ORG.lead.task = a.name + 'に「' + a.task + '」';
    logs.unshift({ t: now, id: 'matome', text: a.name + 'に「' + a.task + '」を割り振り' });
    logs.unshift({ t: now, id: a.id, text: '出動：' + a.task });
  } else if (a.status === 'active' && activeN > 1 && Math.random() < 0.5) {
    a.status = 'recent'; stats.done++;
    logs.unshift({ t: now, id: a.id, text: '完了：' + a.task });
    if (Math.random() < 0.4) { stats.report = hhmm(new Date()); logs.unshift({ t: now, id: 'matome', text: '社長に報告' }); }
  } else if (a.status === 'recent' && Math.random() < 0.35) {
    a.status = 'idle'; a.task = '';
  }
  if (logs.length > 80) logs.length = 80;
  paintAll(); drawSpark(); renderLog();
  if (openId) openDrawer(openId);
}

// ===== 詳しく見る =====
let openId = null;
const drawer = $('#drawer');
function openDrawer(id) {
  const a = who(id); openId = id;
  let body;
  if (id === 'owner') {
    const os = (ORG.owner.orders || []).slice(0, 8);
    body = '<h4>最近の指示</h4>' + (os.length ? '<ul>' + os.map(o => '<li><time>' + hhmm(new Date(o.t)) + '</time>' + esc(o.text) + '</li>').join('') + '</ul>' : '<p class="note">まだ指示はありません。</p>');
  } else {
    const mine = logs.filter(l => l.id === id).slice(0, 6);
    body = '<dl><dt>状態</dt><dd>' + ST[a.status] + '</dd>' +
      (a.dept ? '<dt>レベル</dt><dd>Lv.' + a.lv + '</dd><dt>部署</dt><dd>' + esc(a.dept) + '</dd>' : '') +
      '<dt>今の仕事</dt><dd>' + (a.status === 'active' ? esc(a.task) : a.status === 'recent' && a.task ? '済：' + esc(a.task) : 'なし') + '</dd>' +
      '<dt>任せること</dt><dd>' + esc(a.resp) + '</dd></dl>' +
      (a.report ? '<h4>最後の報告</h4><p class="report">' + esc(a.report) + '</p>' : '') +
      '<h4>最近の記録</h4>' + (mine.length ? '<ul>' + mine.map(l => '<li><time>' + hhmm(new Date(l.t)) + '</time>' + esc(l.text) + '</li>').join('') + '</ul>' : '<p class="note">まだ記録はありません。</p>');
  }
  drawer.innerHTML = '<div class="hd">' + badge(a, 'big') + '<div><h3>' + esc(a.name) + '</h3><p>' + esc(a.role) + '</p></div>' +
    '<button class="pill x" id="closeDrawer" type="button" aria-label="閉じる">×</button></div>' + body;
  drawer.hidden = false;
  $('#closeDrawer').onclick = closeDrawer;
}
function closeDrawer() { drawer.hidden = true; openId = null; }
function openFrom(e) { const el = e.target.closest('[data-id]'); if (!el) return; openDrawer(el.dataset.id); $('#closeDrawer').focus(); }
chart.addEventListener('click', openFrom);
chart.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openFrom(e); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });

// ===== 全体表示と等倍 =====
let fitMode = true;
function fit() {
  const vw = $('#viewport').clientWidth, cw = chart.offsetWidth, ch = chart.offsetHeight;
  const s = fitMode ? Math.min(1, vw / cw) : 1;
  chart.style.transform = s < 1 ? 'scale(' + s + ')' : '';
  $('#stage').style.width = cw * s + 'px';
  $('#stage').style.height = ch * s + 'px';
  $('#fit').textContent = fitMode ? '等倍で見る' : '全体を表示';
  $('#fit').hidden = vw >= cw;
}
$('#fit').onclick = () => { fitMode = !fitMode; fit(); };
function relayout(rebuild) {
  if (rebuild) build();
  drawWires(); fit();
  if (rebuild) paintAll();
}

// ===== 止める・動かす =====
let paused = false, simTimer = null;
$('#pause').onclick = () => {
  paused = !paused;
  document.body.classList.toggle('paused', paused);
  $('#pause').textContent = paused ? '動きを再開' : '動きを止める';
  $('#pause').setAttribute('aria-pressed', paused);
  if (paused) svg.pauseAnimations(); else svg.unpauseAnimations();
};

// ===== 時計 =====
const clock = () => { $('#clock').textContent = hhmmss(new Date()); };
setInterval(clock, 1000);

// ===== はじめの表示 =====
build(); seedDemo(); clock(); paintAll(); drawSpark(); renderLog(); drawWires(); fit();
simTimer = setInterval(() => { if (!paused) tick(); }, 2600);
poll();
setInterval(() => { if (live || location.protocol === 'file:' || misses < 3) poll(); }, 3000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => relayout(false));
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => relayout(false), 120); });
</script>
</body>
